name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose up --build -d

      - name: Show container logs if app isn't running
        run: docker compose logs app

      - name: Run pytest
        run: docker exec vigil-app-1 pytest

      - name: Tear down
        if: always()
        run: docker compose down